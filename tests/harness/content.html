<!doctype html>
<!-- Manual harness for extension/content.js in a normal browser: stubs the `browser` API and the AirPlay picker.
     Serve the project root (python3 -m http.server) and open /tests/harness/content.html?case=<name>.
     Cases: normal, site-off, none, noload, overlay, protected. Drive it with window.__send(srcUrl). -->
<html lang="en"><head><meta charset="utf-8"><title>content.js harness</title>
<style>body{margin:16px;font:14px system-ui}video{width:480px;height:270px;background:#222;display:block}.wrap{position:relative;width:480px}.ov{position:absolute;inset:0 0 40px 0}</style></head>
<body><h3 id="t"></h3><div id="stage"></div>
<script>
const c = new URLSearchParams(location.search).get('case') || 'normal';
document.getElementById('t').textContent = 'case: ' + c;
const SRC = '../../fixtures/media/sample.mp4', stage = document.getElementById('stage');
const attrs = { normal: '', 'site-off': 'disableremoteplayback x-webkit-airplay="deny"', noload: '', overlay: '', protected: '' };
if (c !== 'none') stage.innerHTML = `<div class="wrap"><video id="v" controls ${c === 'noload' ? '' : 'src="' + SRC + '" preload="auto"'} ${attrs[c] || ''}></video>${c === 'overlay' ? '<div class="ov" id="ov"></div>' : ''}</div>`;
if (c === 'protected') Object.defineProperty(document.getElementById('v'), 'mediaKeys', { value: {} });
window.__picked = []; window.__handler = null; window.__shadows = [];
const __attach = Element.prototype.attachShadow; Element.prototype.attachShadow = function (o) { const r = __attach.call(this, o); window.__shadows.push(r); return r; }; // lets the harness read the closed pill
window.__pillText = () => { const r = window.__shadows[window.__shadows.length - 1]; const el = r && r.querySelector('.gate-pill'); return el ? { text: el.textContent.trim(), tile: r.querySelector('.gate-tile').className, hostAttached: !!r.host.isConnected } : null; };
HTMLVideoElement.prototype.webkitShowPlaybackTargetPicker = function () { window.__picked.push({ id: this.id, disableRemotePlayback: this.disableRemotePlayback, airplay: this.getAttribute('x-webkit-airplay'), hadAttr: this.hasAttribute('disableremoteplayback') }); };
window.browser = { runtime: { id: 'stub', sendMessage: async () => (await (await fetch('../../extension/design/tokens.css')).text()) + '\n' + (await (await fetch('../../extension/design/components.css')).text()), onMessage: { addListener: (fn) => { window.__handler = fn; } } } };
window.__send = (srcUrl) => window.__handler({ type: 'beam', srcUrl }, { id: 'stub' });
const load = (s) => new Promise((r) => { const e = document.createElement('script'); e.src = s; e.onload = r; document.body.append(e); });
(async () => { for (const f of ['resolve', 'reasons', 'cast', 'pill']) await load('../../extension/lib/' + f + '.js'); await load('../../extension/content.js');
  if (c === 'protected') document.getElementById('v').dispatchEvent(new Event('encrypted')); // after content.js is listening
  window.__ready = true; })();
</script></body></html>
